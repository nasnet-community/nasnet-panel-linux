syntax = "proto3";

package SpaceX.API.Device;

option go_package = "github.com/nasnet-community/nasnet-panel-linux/pkg/starlink/pb";

// ========================
// ENUMS
// ========================

enum HasActuators {
  HAS_ACTUATORS_UNKNOWN = 0;
  HAS_ACTUATORS_YES = 1;
  HAS_ACTUATORS_NO = 2;
}

enum ActuatorState {
  ACTUATOR_STATE_IDLE = 0;
  ACTUATOR_STATE_FULL_TILT = 1;
  ACTUATOR_STATE_ROTATE = 2;
  ACTUATOR_STATE_TILT = 3;
  ACTUATOR_STATE_UNWRAP_POSITIVE = 4;
  ACTUATOR_STATE_UNWRAP_NEGATIVE = 5;
  ACTUATOR_STATE_TILT_TO_STOWED = 6;
  ACTUATOR_STATE_FAULTED = 7;
  ACTUATOR_STATE_WAIT_TIL_STATIC = 8;
  ACTUATOR_STATE_DRIVE_TO_MOBILE_POSITION = 9;
  ACTUATOR_STATE_MOBILE_WAIT = 10;
}

enum SoftwareUpdateState {
  SOFTWARE_UPDATE_STATE_UNKNOWN = 0;
  IDLE = 1;
  FETCHING = 2;
  PRE_CHECK = 3;
  WRITING = 4;
  POST_CHECK = 5;
  REBOOT_REQUIRED = 6;
  DISABLED = 7;
  FAULTED = 8;
}

enum UserClassOfService {
  UNKNOWN_USER_CLASS_OF_SERVICE = 0;
  CONSUMER = 1;
  BUSINESS = 2;
  BUSINESS_PLUS = 3;
  COMMERCIAL_AVIATION = 4;
}

enum AttitudeEstimationState {
  FILTER_RESET = 0;
  FILTER_UNCONVERGED = 1;
  FILTER_CONVERGED = 2;
  FILTER_FAULTED = 3;
  FILTER_INVALID = 4;
}

enum UserMobilityClass {
  STATIONARY = 0;
  NOMADIC = 1;
  MOBILE = 2;
}

enum RouterRole {
  UNSPECIFIED = 0;
  CONTROLLER = 1;
  REPEATER = 2;
  BYPASSED = 3;
}

enum RebootReason {
  REBOOT_REASON_NONE = 0;
  REBOOT_REASON_MANUAL = 1;
  REBOOT_REASON_LOSS_OF_COMM = 2;
  REBOOT_REASON_SWUPDATE_NOW = 3;
  REBOOT_REASON_SWUPDATE_SCHEDULED = 4;
  REBOOT_REASON_APP = 5;
  REBOOT_REASON_EMC = 6;
  REBOOT_REASON_FACTORY_RESET = 7;
  REBOOT_REASON_TEST_CASE = 8;
  REBOOT_REASON_THERMAL_POWER_CUT = 9;
  REBOOT_REASON_CRITICAL_PROCESS_DIED = 10;
  REBOOT_REASON_NO_RF_READY = 11;
  REBOOT_REASON_POSTPONED_LOSS_OF_COMM = 12;
  REBOOT_REASON_SWUPDATE_STATIONARY = 13;
  REBOOT_REASON_AAP_CRASH = 14;
  REBOOT_REASON_XP70_SACS = 15;
  REBOOT_REASON_INE_FAILED = 16;
  REBOOT_REASON_KERNEL_TAINTED = 17;
}

enum AccountShard {
  ACCOUNT_SHARD_UNKNOWN = 0;
  ACCOUNT_SHARD_DEFAULT = 1;
  ACCOUNT_SHARD_INDIA = 2;
  ACCOUNT_SHARD_STARSHIELD = 3;
}

enum PositionSource {
  POSITION_AUTO = 0;
  POSITION_NONE = 1;
  UT_INFO = 2;
  EXTERNAL = 3;
  GPS = 4;
  STARLINK = 5;
  GNC_FUSED = 6;
  GNC_BAD_SAT = 7;
  GNC_GPS = 8;
  GNC_PNT = 9;
  GNC_STATIC = 10;
}

enum PingTarget {
  PING_TARGET_UNKNOWN = 0;
  PING_TARGET_GOOGLE = 1;
  PING_TARGET_CLOUDFLARE = 2;
  PING_TARGET_POP = 3;
}

enum SpeedtestError {
  SPEEDTEST_ERROR_NONE = 0;
  SPEEDTEST_ERROR_UNKNOWN = 1;
  SPEEDTEST_ERROR_TIMEOUT = 2;
  SPEEDTEST_ERROR_NO_RESULT = 3;
}

enum ObstructionMapReferenceFrame {
  FRAME_UNKNOWN = 0;
  FRAME_EARTH = 1;
  FRAME_UT = 2;
}

// ========================
// STATUS MESSAGE (from SpaceX.API.Status)
// ========================

message Status {
  int32 code = 1;
  string message = 2;
}

// ========================
// SHARED SUB-MESSAGES
// ========================

message DeviceInfo {
  string id = 1;
  string hardware_version = 2;
  string software_version = 3;
  string country_code = 4;
  int32 utc_offset_s = 5;
  bool software_partitions_equal = 6;
  bool is_dev = 7;
  int32 bootcount = 8;
  int32 anti_rollback_version = 9;
  bool is_hitl = 10;
  string manufactured_version = 11;
  int64 generation_number = 12;
  bool dish_cohoused = 13;
  int32 board_rev = 14;
  string build_id = 15;
}

message DeviceState {
  uint64 uptime_s = 1;
}

message DishObstructionStats {
  float fraction_obstructed = 1;
  float valid_s = 4;
  bool currently_obstructed = 5;
  float avg_prolonged_obstruction_duration_s = 6;
  float avg_prolonged_obstruction_interval_s = 7;
  bool avg_prolonged_obstruction_valid = 8;
  float time_obstructed = 9;
  uint32 patches_valid = 10;
}

message DishAlerts {
  bool motors_stuck = 1;
  bool thermal_shutdown = 2;
  bool thermal_throttle = 3;
  bool unexpected_location = 4;
  bool mast_not_near_vertical = 5;
  bool slow_ethernet_speeds = 6;
  bool roaming = 7;
  bool install_pending = 8;
  bool is_heating = 9;
  bool power_supply_thermal_throttle = 10;
  bool is_power_save_idle = 11;
  bool dbf_telem_stale = 14;
  bool low_motor_current = 16;
  bool lower_signal_than_predicted = 17;
  bool slow_ethernet_speeds_100 = 18;
  bool obstruction_map_reset = 19;
  bool dish_water_detected = 20;
  bool router_water_detected = 21;
  bool upsu_router_port_slow = 22;
  bool no_ethernet_link = 23;
}

message DishGpsStats {
  bool gps_valid = 1;
  uint32 gps_sats = 2;
  bool no_sats_after_ttff = 3;
  bool inhibit_gps = 4;
}

message DishReadyStates {
  bool cady = 1;
  bool scp = 2;
  bool l1l2 = 3;
  bool xphy = 4;
  bool aap = 5;
  bool rf = 6;
}

message SoftwareUpdateStats {
  SoftwareUpdateState software_update_state = 1;
  float software_update_progress = 2;
  bool update_requires_reboot = 3;
  int64 reboot_scheduled_utc_time = 4;
}

message AlignmentStats {
  HasActuators has_actuators = 1;
  ActuatorState actuator_state = 2;
  float tilt_angle_deg = 3;
  float boresight_azimuth_deg = 4;
  float boresight_elevation_deg = 5;
  AttitudeEstimationState attitude_estimation_state = 6;
  float attitude_uncertainty_deg = 7;
  float desired_boresight_azimuth_deg = 8;
  float desired_boresight_elevation_deg = 9;
}

message InitializationDurationSeconds {
  int32 attitude_initialization = 1;
  int32 burst_detected = 2;
  int32 ekf_converged = 3;
  int32 first_cplane = 4;
  int32 first_pop_ping = 5;
  int32 gps_valid = 6;
  int32 initial_network_entry = 7;
  int32 network_schedule = 8;
  int32 rf_ready = 9;
  int32 stable_connection = 10;
}

message DishConfig {
  SnowMeltMode snow_melt_mode = 1;
  LocationRequestMode location_request_mode = 2;
  LevelDishMode level_dish_mode = 3;
  uint32 power_save_start_minutes = 4;
  uint32 power_save_duration_minutes = 5;
  bool power_save_mode = 6;
  bool swupdate_three_day_deferral_enabled = 7;
  uint32 asset_class = 8;
  uint32 swupdate_reboot_hour = 9;
  bool apply_snow_melt_mode = 1001;
  bool apply_location_request_mode = 2001;
  bool apply_level_dish_mode = 3001;
  bool apply_power_save_start_minutes = 4001;
  bool apply_power_save_duration_minutes = 5001;
  bool apply_power_save_mode = 6001;
  bool apply_swupdate_three_day_deferral_enabled = 7001;
  bool apply_asset_class = 8001;
  bool apply_swupdate_reboot_hour = 9001;

  enum LevelDishMode {
    TILT_LIKE_NORMAL = 0;
    FORCE_LEVEL = 1;
  }
  enum LocationRequestMode {
    LOC_NONE = 0;
    LOCAL = 1;
  }
  enum SnowMeltMode {
    SNOW_AUTO = 0;
    ALWAYS_ON = 1;
    ALWAYS_OFF = 2;
  }
}

message Quaternion {
  float q_scalar = 1;
  float q_x = 2;
  float q_y = 3;
  float q_z = 4;
}

message DishOutage {
  Cause cause = 1;
  int64 start_timestamp_ns = 2;
  uint64 duration_ns = 3;
  bool did_switch = 4;

  enum Cause {
    UNKNOWN = 0;
    BOOTING = 1;
    STOWED = 2;
    THERMAL_SHUTDOWN = 3;
    NO_SCHEDULE = 4;
    NO_SATS = 5;
    OBSTRUCTED = 6;
    NO_DOWNLINK = 7;
    NO_PINGS = 8;
    ACTUATOR_ACTIVITY = 9;
    CABLE_TEST = 10;
    SLEEPING = 11;
    SKY_SEARCH = 13;
  }
}

message RouterInfo {
  RouterRole role = 1;
  int64 last_seen = 2;
}

message LLAPosition {
  double lat = 1;
  double lon = 2;
  double alt = 3;
}

// --- Ping ---
message PingResult {
  float dropRate = 1;
  float latencyMs = 2;
  PingTarget target = 3;
}

// --- Network Interfaces ---
message NetworkInterface {
  string name = 1;
  RxStats rx_stats = 2;
  TxStats tx_stats = 3;
  bool up = 4;
  string mac_address = 5;
  repeated string ipv4_addresses = 6;
  repeated string ipv6_addresses = 7;

  message RxStats {
    uint64 bytes = 1;
    uint64 packets = 2;
    uint64 frame_errors = 3;
  }
  message TxStats {
    uint64 bytes = 1;
    uint64 packets = 2;
  }
}

// --- Speedtest ---
message SpeedtestStatus {
  bool running = 1;
  uint32 id = 2;
  Direction up = 1000;
  Direction down = 1001;

  message Direction {
    repeated float throughputs_mbps = 1;
    SpeedtestError err = 2;
  }
}

// --- WiFi ---
message WifiClient {
  string name = 1;
  string mac_address = 2;
  string ip_address = 3;
  float signal_strength = 4;
  RxStats rx_stats = 5;
  TxStats tx_stats = 6;
  uint32 associated_time_s = 7;
  string mode_str = 8;
  Interface iface = 9;
  float snr = 10;
  int32 psmode = 11;
  uint32 channel_width = 12;
  string upstream_mac_address = 13;
  Role role = 14;
  string device_id = 15;
  string domain = 22;
  bool dot11v_support = 23;
  string iface_name = 26;
  string given_name = 31;
  uint32 hops_from_controller = 32;
  float est_tx_rate_mbps_from_controller = 33;
  float est_rx_rate_mbps_from_controller = 34;
  string hardware_version = 37;
  string software_version = 38;
  uint32 api_version = 39;
  ClientPingMetrics ping_metrics = 40;
  repeated string ipv6_addresses = 41;
  bool blocked = 42;
  uint32 client_id = 43;
  uint32 no_data_idle_s = 45;
  bool dhcp_lease_active = 46;
  bool dhcp_lease_renewed = 47;
  float seconds_until_dhcp_lease_expires = 48;
  bool dhcp_lease_found = 49;
  ClientAlerts alerts = 52;
  uint32 upload_mb = 54;
  uint32 download_mb = 55;
  bool rx_stats_valid = 60;
  bool tx_stats_valid = 61;

  message ClientAlerts {
    bool throughput_limited = 1;
  }
  message ClientPingMetrics {
    bool in_unhappy_hour_2s = 1;
    bool in_unhappy_hour_5s = 2;
    float drop_rate_5m = 3;
    float latency_5m = 4;
  }
  message RxStats {
    uint64 bytes = 1;
    uint64 count_errors = 2;
    int32 nss = 3;
    uint32 mcs = 5;
    uint32 bandwidth = 6;
    uint32 guard_ns = 7;
    uint32 rate_mbps = 8;
    float airtime_fraction_last_1s = 9;
    uint32 sampled_packets = 10;
    uint32 sampled_packets_retried = 11;
    uint32 sampled_packets_dropped = 12;
    uint32 phy_mode = 13;
    float rate_mbps_last_30s = 14;
    float rate_mbps_last_15s = 15;
    float rate_mbps_last_1m_avg = 16;
    float throughput_mbps_last_1m_avg = 17;
  }
  message TxStats {
    uint64 bytes = 1;
    uint64 success_bytes = 2;
    int32 nss = 3;
    uint32 mcs = 5;
    uint32 bandwidth = 6;
    uint32 guard_ns = 7;
    uint32 rate_mbps = 8;
    float airtime_fraction_last_1s = 9;
    uint32 phy_mode = 10;
    float rate_mbps_last_30s = 11;
    float rate_mbps_last_15s = 12;
  }
  enum Interface {
    UNKNOWN = 0;
    ETH = 1;
    RF_2GHZ = 2;
    RF_5GHZ = 3;
    RF_5GHZ_HIGH = 4;
  }
  enum Role {
    ROLE_UNKNOWN = 0;
    CLIENT = 1;
    REPEATER = 2;
    CONTROLLER = 3;
  }
}

message WifiConfig {
  string country_code = 3;
  bool setup_complete = 7;
  uint32 version = 9;
  string mac_wan = 12;
  string mac_lan = 13;
  uint32 channel_2ghz = 19;
  uint32 channel_5ghz = 20;
  bool is_repeater = 23;
  int32 boot_count = 26;
  repeated string nameservers = 30;
  bool bypass_mode = 31;
  bool dfs_enabled = 42;
  uint64 incarnation = 43;
  WirelessMode wireless_mode_2ghz = 44;
  WirelessMode wireless_mode_5ghz = 45;
  HTBandwidth ht_bandwidth_2ghz = 46;
  HTBandwidth ht_bandwidth_5ghz = 47;
  VHTBandwidth vht_bandwidth = 48;
  bool is_aviation = 49;
  bool secure_dns = 50;
  bool ap_mode = 51;
  bool disable_mesh_onboarding = 52;
  bool pin_country_code = 53;
  bool use_public_services = 55;
  bool disable_automated_speedtests = 56;
  uint32 channel_5ghz_high = 57;
  bool outdoor_mode = 63;
  bool disable_2ghz = 64;
  bool disable_5ghz = 65;
  bool disable_5ghz_high = 66;
  bool disable_band_steering = 95;
  repeated Network networks = 1100;
  bool apply_bypass_mode = 1055;
  bool apply_networks = 1101;

  message Network {
    BasicServiceSet basic = 1;
    bool guest = 2;
    repeated BasicServiceSet extra_bss = 3;
    string client_isolation = 4;
    bool landing = 5;
  }
  message BasicServiceSet {
    string bssid = 1003;
    string ssid = 1005;
    Band band = 1011;
    bool disable = 1013;
    bool hidden = 1015;
    string iface_name = 1017;
  }
  enum Band {
    RF_UNKNOWN = 0;
    RF_2GHZ = 1;
    RF_5GHZ = 2;
    RF_5GHZ_HIGH = 3;
  }
  enum WirelessMode {
    WIRELESS_MODE_DEFAULT = 0;
    A_ONLY = 1;
    B_ONLY = 2;
    G_ONLY = 3;
    N_ONLY = 4;
    B_G = 5;
    A_N = 6;
    B_G_N = 7;
    A_N_AC = 8;
    A_N_AC_AX = 9;
    B_G_N_AX = 10;
  }
  enum HTBandwidth {
    HT_BANDWIDTH_DEFAULT = 0;
    HT_BANDWIDTH_20_MHZ = 1;
    HT_BANDWIDTH_20_OR_40_MHZ = 2;
  }
  enum VHTBandwidth {
    VHT_BANDWIDTH_DEFAULT = 0;
    VHT_BANDWIDTH_DISABLED = 1;
    VHT_BANDWIDTH_80_MHZ = 2;
    VHT_BANDWIDTH_160_MHZ = 3;
    VHT_BANDWIDTH_80_PLUS_80_MHZ = 4;
  }
}

message WifiAlerts {
  bool thermal_throttle = 1;
  bool install_pending = 2;
  bool freshly_fused = 3;
  bool lan_eth_slow_link_10 = 4;
  bool lan_eth_slow_link_100 = 5;
  bool wan_eth_poor_connection = 10;
  bool mesh_topology_changing_often = 11;
  bool mesh_unreliable_backhaul = 12;
  bool radius_missing_process = 13;
  bool eth_switch_error = 14;
  bool poe_on_dish_unreachable = 15;
  bool poe_fuse_blown = 16;
  bool poe_router_overcurrent = 17;
  bool poe_off_current_nominal = 18;
  bool poe_vin_overvoltage = 19;
  bool poe_vin_undervoltage = 20;
  bool high_cable_ping_drop_rate = 21;
  bool sandbox_disabled = 22;
  bool only_overflight_blocked = 23;
  bool offline_networks_disabled = 24;
  bool wired_mesh_not_using_wan_iface = 25;
}

message PingMetrics {
  float latency_mean_ms = 1;
  float latency_stddev_ms = 2;
  float latency_mean_ms_5m = 3;
  float latency_mean_ms_1h = 4;
  float latency_mean_ms_1d = 5;
  float drop_rate = 6;
  float drop_rate_5m = 7;
  float drop_rate_1h = 8;
  float drop_rate_1d = 9;
  float seconds_since_last_success = 10;
  float seconds_since_last_1s_outage = 11;
  float seconds_since_last_5s_outage = 12;
  float happy_hours_1s_1d = 13;
  float happy_hours_5s_1d = 14;
  float seconds_since_last_2s_outage = 15;
  float happy_hours_2s_1d = 16;
  float seconds_since_last_15s_outage = 18;
  float seconds_since_last_60s_outage = 19;
  float seconds_since_last_300s_outage = 20;
}

message RadioStats {
  WifiConfig.Band band = 1;
  NetworkInterface.RxStats rx_stats = 2;
  NetworkInterface.TxStats tx_stats = 3;
  ThermalStatus thermal_status = 4;
  AntennaStatus antenna_status = 5;

  message AntennaStatus {
    float rssi1 = 1;
    float rssi2 = 2;
    float rssi3 = 3;
    float rssi4 = 4;
  }
  message ThermalStatus {
    uint32 level = 1;
    double temp2 = 3;
    uint32 power_reduction = 4;
    uint32 duty_cycle = 5;
  }
}

// ========================
// SERVICE
// ========================

service Device {
  rpc Handle(Request) returns (Response);
}

// ========================
// REQUESTS
// ========================

message Request {
  uint64 id = 1;
  string target_id = 13;
  uint64 epoch_id = 14;
  oneof request {
    // Existing
    RebootRequest reboot = 1001;
    GetStatusRequest get_status = 1004;
    GetHistoryRequest get_history = 1007;
    GetLocationRequest get_location = 1017;
    DishStowRequest dish_stow = 2002;
    GetDiagnosticsRequest get_diagnostics = 6000;
    // Tier 1 Queries
    GetDeviceInfoRequest get_device_info = 1008;
    GetPingRequest get_ping = 1009;
    GetNetworkInterfacesRequest get_network_interfaces = 1015;
    PingHostRequest ping_host = 1016;
    GetConnectionsRequest get_connections = 1023;
    StartSpeedtestRequest start_speedtest = 1027;
    GetSpeedtestStatusRequest get_speedtest_status = 1028;
    SelfTestRequest self_test = 1031;
    GetRadioStatsRequest get_radio_stats = 1036;
    GetTimeRequest time = 1037;
    DishGetContextRequest dish_get_context = 2003;
    DishGetObstructionMapRequest dish_get_obstruction_map = 2008;
    DishSetConfigRequest dish_set_config = 2010;
    DishGetConfigRequest dish_get_config = 2011;
    DishPowerSaveRequest dish_power_save = 2013;
    DishClearObstructionMapRequest dish_clear_obstruction_map = 2017;
    DishFactoryResetRequest dish_factory_reset = 2021;
    WifiSetConfigRequest wifi_set_config = 3001;
    WifiGetClientsRequest wifi_get_clients = 3002;
    WifiGetPingMetricsRequest wifi_get_ping_metrics = 3007;
    WifiGetConfigRequest wifi_get_config = 3009;
    WifiSetClientGivenNameRequest wifi_set_client_given_name = 3017;
    // Tier 1 Actions
    FactoryResetRequest factory_reset = 1011;
    SoftwareUpdateRequest software_update = 1033;
    RestartControlRequest restart_control = 1020;
  }
}

// --- Existing Requests ---
message RebootRequest {}
message GetStatusRequest {}
message GetHistoryRequest {}
message GetLocationRequest {
  PositionSource source = 1;
}
message DishStowRequest {
  bool unstow = 1;
}
message GetDiagnosticsRequest {}

// --- Tier 1 Query Requests ---
message GetDeviceInfoRequest {}
message GetPingRequest {}
message GetNetworkInterfacesRequest {}
message PingHostRequest {
  string address = 3;
  uint32 size = 4;
}
message GetConnectionsRequest {}
message StartSpeedtestRequest {}
message GetSpeedtestStatusRequest {}
message SelfTestRequest {
  bool detailed = 1;
}
message GetRadioStatsRequest {}
message GetTimeRequest {}
message DishGetContextRequest {}
message DishGetObstructionMapRequest {}
message DishGetConfigRequest {}
message DishSetConfigRequest {
  DishConfig dish_config = 1;
}
message DishPowerSaveRequest {
  uint32 power_save_start_minutes = 1;
  uint32 power_save_duration_minutes = 2;
  bool enable_power_save = 3;
}
message DishClearObstructionMapRequest {}
message WifiGetClientsRequest {}
message WifiGetConfigRequest {}
message WifiSetConfigRequest {
  WifiConfig wifi_config = 1;
}
message WifiGetPingMetricsRequest {}
message WifiSetClientGivenNameRequest {
  uint32 client_id = 1;
  string given_name = 2;
}

// --- Tier 1 Action Requests ---
message FactoryResetRequest {}
message DishFactoryResetRequest {}
message SoftwareUpdateRequest {}
message RestartControlRequest {}

// ========================
// RESPONSES
// ========================

message Response {
  uint64 id = 1;
  Status status = 2;
  uint64 api_version = 3;
  oneof response {
    // Existing
    RebootResponse reboot = 1001;
    DishGetStatusResponse dish_get_status = 2004;
    DishGetHistoryResponse dish_get_history = 2006;
    DishStowResponse dish_stow = 2002;
    GetLocationResponse get_location = 1017;
    WifiGetDiagnosticsResponse wifi_get_diagnostics = 6000;
    DishGetDiagnosticsResponse dish_get_diagnostics = 6001;
    // Tier 1 Queries
    GetDeviceInfoResponse get_device_info = 1004;
    GetPingResponse get_ping = 1009;
    GetNetworkInterfacesResponse get_network_interfaces = 1015;
    PingHostResponse ping_host = 1016;
    GetConnectionsResponse get_connections = 1023;
    StartSpeedtestResponse start_speedtest = 1027;
    GetSpeedtestStatusResponse get_speedtest_status = 1028;
    SelfTestResponse self_test = 1031;
    GetRadioStatsResponse get_radio_stats = 1035;
    GetTimeResponse time = 1037;
    DishGetContextResponse dish_get_context = 2003;
    DishGetObstructionMapResponse dish_get_obstruction_map = 2008;
    DishSetConfigResponse dish_set_config = 2010;
    DishGetConfigResponse dish_get_config = 2011;
    DishClearObstructionMapResponse dish_clear_obstruction_map = 2015;
    DishFactoryResetResponse dish_factory_reset = 2021;
    WifiSetConfigResponse wifi_set_config = 3001;
    WifiGetClientsResponse wifi_get_clients = 3002;
    WifiGetPingMetricsResponse wifi_get_ping_metrics = 3007;
    WifiGetConfigResponse wifi_get_config = 3009;
    // Tier 1 Actions
    FactoryResetResponse factory_reset = 1011;
    SoftwareUpdateResponse software_update = 1033;
    RestartControlResponse restart_control = 1020;
  }
}

// --- Existing Responses ---
message RebootResponse {}
message DishStowResponse {}

// --- Get Status Response ---
message DishGetStatusResponse {
  DeviceInfo device_info = 1;
  DeviceState device_state = 2;
  float seconds_to_first_nonempty_slot = 1002;
  float pop_ping_drop_rate = 1003;
  DishObstructionStats obstruction_stats = 1004;
  DishAlerts alerts = 1005;
  float downlink_throughput_bps = 1007;
  float uplink_throughput_bps = 1008;
  float pop_ping_latency_ms = 1009;
  bool stow_requested = 1010;
  float boresight_azimuth_deg = 1011;
  float boresight_elevation_deg = 1012;
  DishOutage outage = 1014;
  DishGpsStats gps_stats = 1015;
  int32 eth_speed_mbps = 1016;
  UserMobilityClass mobility_class = 1017;
  bool is_snr_above_noise_floor = 1018;
  DishReadyStates ready_states = 1019;
  UserClassOfService class_of_service = 1020;
