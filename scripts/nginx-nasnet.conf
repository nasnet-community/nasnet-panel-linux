server {
    listen [::]:5000 ssl ipv6only=off reuseport;
    listen [::]:5000 quic reuseport ipv6only=off;

    server_name api.example.com;

    root /var/www/html;
    index index.html;

    # HTTP versions
    http2 on;
    http3 on;
    http3_hq on;

    # SSL Configuration
    ssl_certificate /root/.acme.sh/api.example.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/api.example.com_ecc/api.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # QUIC/HTTP3 headers
    add_header Alt-Svc 'h3=":5000"; ma=86400' always;

    # Global timeouts
    client_header_timeout 5m;
    client_body_timeout 5m;
    keepalive_timeout 5m;
    send_timeout 5m;

    # XHTTP Location
    location /your-camouflage-filename.zip {
        client_max_body_size 0;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_body_timeout 5m;
        grpc_read_timeout 315;
        grpc_send_timeout 5m;
        grpc_pass unix:/dev/shm/xrxh.socket;
    }

    # 3x-ui panel
    location /3x/ {
        proxy_pass http://127.0.0.1:30470;
        proxy_http_version 1.1;

        proxy_redirect http://127.0.0.1:30470/ https://api.example.com/panel/;
        proxy_redirect http://localhost:30470/ https://api.example.com/panel/;
        proxy_redirect / /panel/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5m;
        proxy_send_timeout 5m;
        proxy_read_timeout 5m;

        proxy_buffering off;
        client_max_body_size 0;
    }

    # Hidden panel (embedded in Go backend — same port as API)
    location /your-panel-path/ {
        client_max_body_size 0;   # admin xray-binary uploads (~25-40MB); hub caps at 100MB
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 5000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5m;
        proxy_send_timeout 5m;
        proxy_read_timeout 5m;
    }

    # Subscription endpoint (public, for V2Ray clients)
    location /sub/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Fake website (catch-all)
    location / {
        try_files $uri $uri/ =404;
    }
}
