name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Shell syntax and mocked installation regressions
        run: |
          bash -n nasnet-tool.sh scripts/offline-install.sh scripts/docker-entrypoint.sh
          bash scripts/test-installer.sh

      - name: Compose installation variants and bcrypt preservation
        run: python3 scripts/test-installer-compose.py

  go:
    name: Go
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      # Embed targets require these files to exist before `go build` reads
      # the //go:embed directives. In CI we short-circuit the download and
      # use empty stubs — nothing under test resolves routing via geoip,
      # and the embedded bytes are only consumed at runtime by agent nodes.
      - name: Stub embedded assets
        run: |
          mkdir -p pkg/geofiles/embedded
          : > pkg/geofiles/embedded/geoip.dat
          : > pkg/geofiles/embedded/geosite.dat
          mkdir -p web-panel/dist
          : > web-panel/dist/index.html

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        # Root package embeds the frontend dist; skip it here (the web
        # job covers the SPA build). All real coverage lives in sub-
        # packages.
        run: go test -race -count=1 ./internal/... ./pkg/... ./transport/... ./cmd/... ./config/...

      - name: go build (sub-packages)
        run: go build ./internal/... ./pkg/... ./transport/... ./cmd/...

  web:
    name: Web
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        working-directory: web-panel
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
